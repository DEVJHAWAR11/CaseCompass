<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4b3a2a"/></marker>
    <style>
      .t{font-size:15px;fill:#2e2118}.s{font-size:12.5px;fill:#5a4636}.h{font-size:13px;font-weight:700;fill:#1f2a5c;letter-spacing:.06em}
      .b{fill:#fff8e8;stroke:#b8893b;stroke-width:1.5}.d{fill:#e6ecf7;stroke:#1f2a5c;stroke-width:1.5}.o{fill:#eaf1dc;stroke:#6b7d45;stroke-width:1.5}
      .l{stroke:#4b3a2a;stroke-width:1.6;fill:none}
    </style>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#2e2118">CaseCompass: the RAG pipeline at search time</text>
  <text x="30" y="56" class="s">One question in, a handful of real past cases out. Counts are computed in code, never invented by the model.</text>

  <rect class="b" x="30" y="85" width="170" height="70" rx="10"/><text x="115" y="115" text-anchor="middle" class="t">1. Your story</text><text x="115" y="136" text-anchor="middle" class="s">plain words</text>
  <rect class="b" x="250" y="85" width="190" height="70" rx="10"/><text x="345" y="112" text-anchor="middle" class="t">2. Rewrite</text><text x="345" y="132" text-anchor="middle" class="s">1 small LLM call, up to</text><text x="345" y="147" text-anchor="middle" class="s">3 legal-style queries</text>
  <rect class="d" x="490" y="70" width="210" height="46" rx="10"/><text x="595" y="97" text-anchor="middle" class="t">3a. Meaning search (vectors)</text>
  <rect class="d" x="490" y="124" width="210" height="46" rx="10"/><text x="595" y="151" text-anchor="middle" class="t">3b. Keyword search (tsvector)</text>
  <rect class="b" x="750" y="85" width="180" height="70" rx="10"/><text x="840" y="112" text-anchor="middle" class="t">4. Merge: RRF</text><text x="840" y="132" text-anchor="middle" class="s">rank fusion, k=60</text><text x="840" y="147" text-anchor="middle" class="s">best chunk per case</text>

  <path class="l" d="M200 120H248" marker-end="url(#a)"/><path class="l" d="M440 120H470M470 93H488M470 147H488" marker-end="url(#a)"/>
  <path class="l" d="M700 93H724V120H748M700 147H724V120" marker-end="url(#a)"/>

  <rect class="b" x="30" y="215" width="200" height="86" rx="10"/><text x="130" y="243" text-anchor="middle" class="t">5. Look up the cases</text><text x="130" y="264" text-anchor="middle" class="s">stored fields: outcome, amounts,</text><text x="130" y="280" text-anchor="middle" class="s">laws, order sentence, link</text>
  <rect class="o" x="280" y="215" width="200" height="86" rx="10"/><text x="380" y="243" text-anchor="middle" class="t">6. Stats in code</text><text x="380" y="264" text-anchor="middle" class="s">"7 of 10 ruled for the</text><text x="380" y="280" text-anchor="middle" class="s">complainant" is counted, not guessed</text>
  <rect class="b" x="530" y="215" width="200" height="86" rx="10"/><text x="630" y="243" text-anchor="middle" class="t">7. Related cases</text><text x="630" y="264" text-anchor="middle" class="s">citation graph (networkx),</text><text x="630" y="280" text-anchor="middle" class="s">shown in a separate list</text>
  <rect class="o" x="780" y="215" width="150" height="86" rx="10"/><text x="855" y="243" text-anchor="middle" class="t">8. Cards</text><text x="855" y="264" text-anchor="middle" class="s">AI-labelled, with</text><text x="855" y="280" text-anchor="middle" class="s">disclaimer + source</text>
  <path class="l" d="M840 155V190H130V213" marker-end="url(#a)"/><path class="l" d="M230 258H278" marker-end="url(#a)"/><path class="l" d="M480 258H528" marker-end="url(#a)"/><path class="l" d="M730 258H778" marker-end="url(#a)"/>

  <text x="30" y="345" class="h">WHAT THE DATABASE HOLDS (BUILT OFFLINE, ONCE)</text>
  <rect class="d" x="30" y="360" width="280" height="120" rx="10"/>
  <text x="170" y="386" text-anchor="middle" class="t">chunks</text>
  <text x="170" y="408" text-anchor="middle" class="s">facts / issues / order pieces of each judgment</text>
  <text x="170" y="426" text-anchor="middle" class="s">two 1024-number vectors each (standard + late)</text>
  <text x="170" y="444" text-anchor="middle" class="s">+ a keyword index. Text itself lives in case_texts.</text>
  <rect class="d" x="340" y="360" width="280" height="120" rx="10"/>
  <text x="480" y="386" text-anchor="middle" class="t">cases</text>
  <text x="480" y="408" text-anchor="middle" class="s">title, court, date, category (AI-assigned)</text>
  <text x="480" y="426" text-anchor="middle" class="s">outcome, refund, compensation, laws, summary</text>
  <text x="480" y="444" text-anchor="middle" class="s">all extracted once, offline, never at search time</text>
  <rect class="d" x="650" y="360" width="280" height="120" rx="10"/>
  <text x="790" y="386" text-anchor="middle" class="t">citations</text>
  <text x="790" y="408" text-anchor="middle" class="s">which judgment cites which</text>
  <text x="790" y="426" text-anchor="middle" class="s">loaded into a graph for related cases</text>
  <text x="790" y="444" text-anchor="middle" class="s">(plain tables, no graph database)</text>
  <text x="30" y="506" class="s">Shipped default: hybrid + rewriting on late-chunking vectors. Reranking and graph merging were tested and did not help (see eval).</text>
</svg>
